services:
  - type: web
    name: mph-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mph-backend-9nud.onrender.com
      - key: VITE_SITE_URL
        value: https://mph-frontend-qn7j.onrender.com
      - key: VITE_ADMIN_URL
        value: https://mph-admin.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mph-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mph-backend-9nud.onrender.com
      - key: VITE_SITE_URL
        value: https://mph-frontend-qn7j.onrender.com
      - key: VITE_ADMIN_ONLY
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mph-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_manager && python manage.py seed_catalog && python manage.py seed_requests && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: mph-backend-9nud.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mph-postgres
          property: connectionString
      - key: MANAGER_USERNAME
        sync: false
      - key: MANAGER_PASSWORD
        sync: false

databases:
  - name: mph-postgres
    plan: free
    databaseName: machinerypartshub
    user: mphuser
